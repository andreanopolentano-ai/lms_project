services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${DOCKER_IMAGE:-lms-project:latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 3
             --timeout 120"
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  celery_worker:
    image: ${DOCKER_IMAGE:-lms-project:latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: ${DOCKER_IMAGE:-lms-project:latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

  auto_deploy:
    image: docker:29-cli
    restart: unless-stopped
    profiles:
      - production
    working_dir: /opt/lms
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/lms:/opt/lms
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          docker pull --quiet "$$DOCKER_IMAGE"
          docker compose --profile production up -d --no-build \
            db redis web celery_worker celery_beat nginx
          sleep 300
        done

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
